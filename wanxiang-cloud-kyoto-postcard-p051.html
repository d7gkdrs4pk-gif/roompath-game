const PLACE_INFO={"station":"这里是京阪电车祇园四条站的出入口。它位于鸭川东侧，走出车站不远就能到四条大桥和南座。先看一眼站牌，再决定今天从剧场还是从河边开始。","minamiza":"南座坐落在京都四条通，靠近鸭川东岸，是与歌舞伎演出传统相关的剧场。看一看它的屋顶线条和入口装饰，能感受到京都繁忙街道里的传统气息。","riverSpring":"从四条大桥向上游望去，鸭川穿过京都市区。两岸有步行空间和临河建筑，远处的桥梁依次排开。这里值得做的事很简单：顺着河道把目光慢慢放远。","riverSummer":"这也是四条大桥附近的鸭川，但拍摄于另一年的夏季。观察河岸建筑和行走空间，与刚才的春日画面对照，能看到同一条河在不同季节的细微变化。","yuka":"鸭川西岸夏季常见的“纳凉床”，是临河餐厅设置的露天用餐平台。人们坐在河边感受夜风，也是京都颇有代表性的夏日风景。可以留意平台的支撑结构。","oldStreet":"先斗町是一条与鸭川大致平行的狭窄街巷，分布着餐饮店铺。木格栅、门廊和曲折的透视线，让这里与宽阔的城市主干道形成鲜明对比。","alleyRed":"镜头走进先斗町的餐厅街区。门前灯笼与街巷的纵深带来温暖的视觉层次；这张照片只是某一年的一个瞬间，不代表此时正在发生相同的活动。","lantern":"纸灯笼是京都传统街巷里容易注意到的细节。与整条道路相比，这张特写让你看清灯笼的材质、字样和光影。旅行记忆有时就来自这样一个小物件。","kaiseki":"先斗町的狭窄巷道两旁分布着餐饮店铺。可以观察门口的灯光、招牌与木质立面；照片记录的是过去某年的街景，不代表照片中的店铺如今仍在营业。","streetLights":"入夜后的先斗町，灯笼与街灯映亮狭窄的街道。画面中出现的行人只是实拍经过的陌生人，故事不会为他们虚构身份。静静看看夜里的街巷方向。","streetBw":"这一张独立的黑白摄影，把注意力放到街巷线条、行人轮廓和亮暗对比上。你可以不急着进入下一站，先观察照片中从近到远的空间层次。","riverNight":"夜晚的鸭川呈现出与白天不同的样子：临河建筑灯光亮起，河岸步道与水面在暗处交汇。这是另一拍摄日期的实景，适合作为本次时光漫游的结尾。"};

		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {

				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;

				this.modules[8][15 - h - 1] = mod;
			}

					if (this.modules[row][col - c] === null) {

						}

							byteIndex++;

						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

function renderWelcome(){const a=MEDIA.riverSpring;app.innerHTML=`<main class="frame hero immersive">${photoBox(a)}${topBar()}<section class="content"><div class="eyebrow">京都 · 鸭川与先斗町 / 旅行分享版</div><h1 class="h1 introtitle">京都的<br>一次慢旅行</h1><p class="lead">沿鸭川散步，走进先斗町。按自己的节奏看一看京都。</p>${validRecord(state.friendJourney)?`<p class="friendNote">${esc(normalNickname(state.friendJourney.n))}把自己喜欢的京都风景分享给了你。现在，按自己的节奏看一看。</p>`:''}<div class="welcomeName"><label for="nickname">你的旅行昵称（可选）</label><input id="nickname" type="text" autocomplete="off" maxlength="12" placeholder="例如：山茶旅人" value="${esc(state.nickname||'')}" oninput="updateNickname(this.value)"><small>只用于你的旅行明信片，是否分享由你决定</small></div><div class="muted">今天想怎样旅行？</div><div class="moodgrid">${['放空','好奇','记录'].map(x=>`<button class="mood ${state.mood===x?'active':''}" aria-pressed="${state.mood===x}" onclick="setMood('${x}')">${x}</button>`).join('')}</div><button class="btn gold" onclick="begin()">进入京都 <span class="arr">→</span></button></section></main>`}

function begin(){state.at='station';state.visited=[];state.insights=[];state.stamps=[];state.memories=[];state.history=[];state.detail=false;save();render()}
function renderScene(){const k=state.at,s=SCENES[k],a=MEDIA[k];if(!s||!a){state.at='welcome';render();return}if(!state.visited.includes(k))state.visited.push(k);save();const old=state.visited.length;app.innerHTML=`<main class="frame immersive">${photoBox(a)}${topBar(true)}<div class="progress"><b style="width:${Math.min(100,Math.round(old/12*100))}%"></b></div><section class="content"><div class="scene-index"><div class="eyebrow">${esc(s.title.split(' · ')[0])} · 京都漫游</div><div class="muted">${old}/12 已探索</div></div><h1 class="h1">${esc(a.name)}</h1><p class="lead">${esc(SHORT[k]||s.location)}</p><div class="choices">${s.options.map((o,j)=>`<button class="btn" onclick="choose(${j})"><span>${esc(o[0])}</span><span class="arr">→</span></button>`).join('')}</div><div class="bottomnav"><button class="smallbtn" onclick="back()">← 上一站</button><button class="smallbtn" onclick="gallery()">全部影像</button></div></section></main>`}
function toggleDetail(){state.detail=!state.detail;save();render()}
function choose(n){let s=SCENES[state.at],o=s.options[n];if(!o)return;state.history.push(JSON.stringify({at:state.at,visited:[...state.visited],insights:[...(state.insights||[])],stamps:[...state.stamps],memories:[...state.memories],detail:state.detail}));if(state.history.length>20)state.history.shift();if(!state.stamps.includes(s.stamp))state.stamps.push(s.stamp);if(!state.stamps.includes(o[2]))state.stamps.push(o[2]);state.memories.push(`${s.subtitle}：${o[0]}`);if(state.memories.length>13)state.memories.shift();state.at=o[1];state.detail=false;save();render();window.scrollTo(0,0)}
function back(){let prev=state.history.pop();if(!prev){state.at='welcome';state.detail=false}else{let s=JSON.parse(prev);state.at=s.at;state.visited=s.visited;state.insights=s.insights||[];state.stamps=s.stamps;state.memories=s.memories;state.detail=s.detail;}save();render()}
function renderEnd(){
 const rec=recordNow(),n=recVisited(rec).length,info=recInsights(rec).length,earned=awards(rec);
 const key=featuredScene(rec),name=MEDIA[key]?.name||'鸭川',line=postcardLine(rec),title=recordTitle(rec);
 const friend=validRecord(state.friendJourney);
 app.innerHTML=`<main class="frame immersive">${photoBox(MEDIA.riverNight)}${topBar()}<section class="content"><div class="eyebrow">京都 · 我的云旅行纪念</div><div class="journal"><div class="rewardBadge">✦ ${esc(title)}</div><h2>${esc(rec.n)}，<br>你收藏了一段京都时光。</h2><p class="lead" style="margin-bottom:7px">真实的风景，不必匆忙看完。</p><div class="memorySpot"><strong>你可以分享的这一站：${esc(name)}</strong><span>${esc(line)}</span></div><p class="muted">这次你看过${n}处实景，深入了解${info}个地点。<br>走过的地方：${esc(pathSummary(rec,5))}</p><div class="achievementGrid">${earned.length?earned.slice(0,3).map(a=>`<span class="achievement">✦ ${esc(a.title)}</span>`).join(''):'<span class="muted">下一次可以换条路线，再发现不同的风景。</span>'}</div>${friend?`<p class="friendNote">从${esc(normalNickname(friend.n))}分享的一张风景开始，你也走出了一段属于自己的旅程。</p>`:''}<div class="rewardFoot">实景互动云旅行，非真实到访证明；照片来自不同时期。</div></div><div class="choices"><button class="btn gold" onclick="openPoster()">制作我的京都旅行明信片 <span class="arr">▧</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="shareLink()">分享给朋友看看 <span class="arr">↗</span></button><button class="btn secondary" onclick="copyLink()">复制旅行邀请链接 <span class="arr">⧉</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="review()">回看照片 <span class="arr">→</span></button><button class="btn secondary" onclick="restart()">再走一条路线 <span class="arr">↻</span></button></div></section></main>`
}

function review(){gallery(true)}
function gallery(visitedOnly=false){const keys=visitedOnly?state.visited:Object.keys(MEDIA);const items=keys.map(k=>MEDIA[k]).filter(Boolean);app.innerHTML=`<main class="frame library"><div class="libraryhead"><div class="eyebrow">京都 · 旅行相册</div><button class="round" onclick="render()">返回旅程</button></div><h2>${visitedOnly?'走过的地方':'全部实景'}</h2><div class="librarygrid">${items.map(a=>`<div class="libraryitem"><img src="${a.src}" alt="${esc(a.name)}" loading="lazy" referrerpolicy="no-referrer"><div>${esc(a.name)}</div></div>`).join('')}</div><button class="smallbtn" onclick="help()" style="margin-top:22px">关于这趟旅行</button></main>`}
function help(){const entries=Object.values(MEDIA).map(a=>`<div>${esc(a.name)} · ${esc(a.author)} · ${esc(a.license)} · <a href="${a.page}" target="_blank" rel="noopener">来源与许可</a></div>`).join('');const z=document.createElement('div');z.className='overlay';z.innerHTML=`<button class="overlayClose">✕ 关闭</button><div class="credits"><h2 style="margin-top:0">关于这趟旅行</h2><p>这是一份京都实景互动内测作品，画面摄于不同时间，并非同一天的连续录像。</p><p>打开地点、选择方向，就能按自己的节奏浏览。</p><details><summary>照片署名与许可信息</summary>${entries}</details></div>`;z.querySelector('button').onclick=()=>z.remove();document.body.appendChild(z)}
function restart(){if(confirm('确定要重新开始吗？这会清空当前路线与收集印记。')){state={at:'welcome',mood:state.mood,nickname:state.nickname||'',visited:[],insights:[],stamps:[],memories:[],history:[],detail:false,friendJourney:null};save();render()}}
function downloadCard(){openPoster()}
function travelTitle(){return recordTitle(recordNow())}
function shortPath(){let names=state.visited.map(k=>MEDIA[k]?.name).filter(Boolean);return names.length?names.slice(0,5):['祇园四条站','鸭川']}
function toast(message){document.querySelectorAll('.toast').forEach(x=>x.remove());const x=document.createElement('div');x.className='toast';x.textContent=message;document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function shareText(){const rec=recordNow(),key=featuredScene(rec),name=MEDIA[key]?.name||'鸭川';return `刚在《京都的一次慢旅行》里看到「${name}」这处实景：${postcardLine(rec)} 我觉得挺有意思，你也点开看看京都吧。`}

async function copyLink(){const url=shareUrl();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url)}else{const x=document.createElement('textarea');x.value=url;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();if(!ok)throw Error('copy blocked')}toast('旅行邀请链接已复制，可以发送给朋友')}catch(e){const x=document.getElementById('shareAddress');if(x){x.value=url;x.focus();x.select()}toast('复制受限，请长按旅行邀请链接复制')}}
async function shareLink(){const url=shareUrl();if(navigator.share){try{await navigator.share({title:'想让你看看京都的一处真实风景｜万象人生',text:shareText(),url});return}catch(e){if(e?.name==='AbortError')return}}await copyLink()}
function loadCanvasPhoto(url){return new Promise(resolve=>{let done=false;const im=new Image();const finish=v=>{if(!done){done=true;resolve(v)}};im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';im.onload=()=>finish(im);im.onerror=()=>finish(null);im.src=url;setTimeout(()=>finish(null),4500)})}
function textWrap(ctx,str,x,y,width,lineH,maxLines){let line='',count=0;for(const ch of str){if(ctx.measureText(line+ch).width>width && line){ctx.fillText(line,x,y+count*lineH);count++;if(count>=maxLines)return;line=ch}else{line+=ch}}if(line && count<maxLines)ctx.fillText(line,x,y+count*lineH)}

function drawJourneyQR(ctx,url,x,y,size){const qr=new QRCode(0,0);qr.addData(url);qr.make();const n=qr.getModuleCount(),cell=Math.floor(size/(n+8)),outer=(n+8)*cell,left=x+Math.floor((size-outer)/2),top=y+Math.floor((size-outer)/2);if(cell<2)throw Error('QR link exceeds poster capacity');ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);ctx.fillStyle='#08191b';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(left+(c+4)*cell,top+(r+4)*cell,cell,cell);return true}
async function makePoster(){
 const c=document.createElement('canvas');c.width=1080;c.height=1920;
 const x=c.getContext('2d'),rec=recordNow(),key=featuredScene(rec),a=MEDIA[key]||MEDIA.riverSpring,url=shareUrl();
 const bg=x.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#244043');bg.addColorStop(1,'#081a1c');x.fillStyle=bg;x.fillRect(0,0,1080,1920);
 const photo=await loadCanvasPhoto(a.src);
 if(photo){const scale=Math.max(1080/photo.width,1450/photo.height),sw=1080/scale,sh=1450/scale,sx=(photo.width-sw)/2,sy=(photo.height-sh)/2;x.drawImage(photo,sx,sy,sw,sh,0,0,1080,1450)}
 else{const g=x.createLinearGradient(0,0,1080,1450);g.addColorStop(0,'#3b6565');g.addColorStop(1,'#10262a');x.fillStyle=g;x.fillRect(0,0,1080,1450)}
 const v=x.createLinearGradient(0,120,0,1535);v.addColorStop(0,'rgba(5,18,19,.27)');v.addColorStop(.39,'rgba(8,22,23,.02)');v.addColorStop(.67,'rgba(8,22,23,.45)');v.addColorStop(1,'#0b1d20');x.fillStyle=v;x.fillRect(0,0,1080,1600);
 x.fillStyle='#f1d59c';x.font='600 33px sans-serif';x.fillText('万象人生  /  KYOTO',76,126);
 x.fillStyle='#fffaf0';x.font='bold 84px serif';x.fillText('原来京都，',76,1015);x.fillText('还有这样的风景。',76,1118);
 x.fillStyle='#f3dab0';x.font='bold 39px sans-serif';textWrap(x,a.name,78,1210,908,48,2);
 x.fillStyle='#edf4ef';x.font='33px sans-serif';textWrap(x,postcardLine(rec),78,1308,910,49,2);
 x.fillStyle='#e9d5a7';x.font='30px sans-serif';textWrap(x,`来自 ${rec.n} 的云旅行明信片`,78,1437,840,44,2);
 x.fillStyle='rgba(225,235,232,.62)';x.fillRect(76,1514,928,1);
 x.fillStyle='#fffaf0';x.font='bold 37px sans-serif';x.fillText('想看看这样的京都吗？',78,1607);
 x.fillStyle='#d2e1dc';x.font='30px sans-serif';x.fillText('扫码进入真实照片漫游',78,1670);
 drawJourneyQR(x,url,761,1516,269);
 x.fillStyle='#e8d49f';x.font='25px sans-serif';x.fillText('扫码去看看',817,1820);
 x.fillStyle='#adbfba';x.font='22px sans-serif';x.fillText('不同时期的实景摄影 · 云端体验，非实际到访证明',76,1863);
 c.dataset.photoReady=photo?'1':'0';
 return c
}

async function openPoster(){
 const url=shareUrl(),z=document.createElement('div');z.className='overlay posterOverlay';
 z.innerHTML=`<div class="posterHead"><strong>我的京都旅行明信片 · P0.5.1</strong><button class="overlayClose" type="button">✕ 关闭</button></div><p class="posterHelp" id="posterStatus">正在生成旅行明信片和风景邀请二维码…</p><div class="posterActions"><button class="btn" type="button" onclick="savePoster()">保存图片</button><button class="btn" type="button" onclick="sharePoster()">分享明信片</button></div><button class="btn secondary" type="button" onclick="shareLink()" style="max-width:430px;justify-content:center">直接分享这处风景</button><input class="posterLink" id="shareAddress" readonly aria-label="我的京都旅行邀请网址" value="${esc(url)}">`;
 z.querySelector('.overlayClose').onclick=()=>z.remove();document.body.appendChild(z);posterFile=null;posterData=null;
 try{
  const c=await makePoster();if(!z.isConnected)return;posterData=c.toDataURL('image/png');
  const im=document.createElement('img');im.className='posterImage';im.alt='京都实景云旅行明信片';im.src=posterData;im.title='手机可长按此图储存到照片';z.querySelector('.posterHead').after(im);
  z.querySelector('#posterStatus').textContent=c.dataset.photoReady==='1'?'朋友扫码后会先看到你喜欢的京都风景，再决定是否开始自己的云旅行。':'当前浏览器未允许将远程实景照片写入明信片。建议直接分享旅行链接，让朋友在网页中看真实照片。';
  c.toBlob(blob=>{if(blob){posterFile=new File([blob],'京都慢旅行_实景旅行明信片.png',{type:'image/png'})}},'image/png')
 }catch(e){z.querySelector('#posterStatus').textContent='明信片暂未生成，可以直接分享旅行邀请链接';toast('明信片生成失败，请稍后重试')}
}

function savePoster(){if(!posterData){toast('海报还没有生成');return}const a=document.createElement('a');a.href=posterData;a.download='京都慢旅行_我的云游纪念.png';document.body.appendChild(a);a.click();a.remove();toast('如未保存，请长按海报图片，选择“储存到照片”')}
async function sharePoster(){if(posterFile&&navigator.share&&navigator.canShare?.({files:[posterFile]})){try{await navigator.share({files:[posterFile],title:'京都的一次慢旅行｜想让你看看这里',text:shareText()});return}catch(e){if(e?.name==='AbortError')return}}toast('请长按明信片保存到相册，再从微信朋友圈选择照片发布')}

render();
</script></body></html>
