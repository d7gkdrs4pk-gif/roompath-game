<style>

const SCENES={"station": {"title": "01 · 旅程起点", "subtitle": "祇园四条站", "location": "四条大桥东侧附近", "body": "车站外的站名让这趟旅程有了坐标。你可以把手机暂时当作一扇窗：这里是真实存在的京都街口，并不是一张被AI编造的日系场景。", "fact": "照片拍摄于2026年6月18日。站口标识中能辨认“祇園四条駅”和“Keihan Railway”；这与车站实际名称一致。", "stamp": "抵达", "options": [["先看一座老剧场", "minamiza", "建筑"], ["直接去看河流", "riverSpring", "河流"]]}, "minamiza": {"title": "02 · 剧场的另一面", "subtitle": "南座", "location": "祇园四条站附近", "body": "你在照片里停留，仔细辨认屋檐、灯笼与门口的招牌。南座坐落在四条通的桥东一侧，属于这片街区容易识别的建筑地标。", "fact": "南座与歌舞伎演出传统有关。此图摄于2007年夜间，画面不能被当作2026年此时此刻的现场。", "stamp": "文化", "options": [["看一眼桥上的春日河景", "riverSpring", "河流"], ["切换到夏日鸭川照片", "riverSummer", "河流"]]}, "riverSpring": {"title": "03 · 站在桥上", "subtitle": "四条大桥·上游", "location": "四条大桥", "body": "河水从城市之间延展。左侧有临河建筑，右侧是树木与步道。看似只是安静的水面，视线却能顺着河道进入更远处。", "fact": "照片标注为2017年4月14日，从四条大桥向鸭川上游拍摄。不同年份的视角在本作品里作为“真实时光切片”并列展示。", "stamp": "河流", "options": [["换成夏天的河岸", "riverSummer", "河流"], ["去看看沿河的临时露台", "yuka", "文化"]]}, "riverSummer": {"title": "04 · 夏季的河岸", "subtitle": "鸭川·四条桥附近", "location": "四条大桥", "body": "这张照片里，最靠近你的不是水，而是一排沿河建筑和通向远处的步道。你可以观察木结构延伸出河岸的方式。", "fact": "照片拍摄于2025年7月17日，画面记录四条大桥附近的河岸建筑。这是另一个拍摄日，并非上一张照片的瞬间延续。", "stamp": "步行", "options": [["近看纳凉床的结构", "yuka", "文化"], ["转入先斗町的街巷", "oldStreet", "街巷"]]}, "yuka": {"title": "05 · 河边的座位", "subtitle": "纳凉床", "location": "鸭川西岸·先斗町附近", "body": "你仔细看，临河餐厅的木平台向岸外伸出，下面是支撑结构。即使隔着屏幕，也能明白为什么“靠河而坐”会成为这里夏季生活的一部分。", "fact": "京都鸭川沿岸的“纳凉床”是夏季临时设置的露天用餐平台，通常出现在5月至9月。照片为2025年6月16日实拍，位置标注在四条大桥附近。", "stamp": "风物", "options": [["走进与河岸平行的先斗町", "oldStreet", "街巷"], ["查看先斗町灯笼街景", "alleyRed", "街巷"]]}, "oldStreet": {"title": "06 · 进入窄巷", "subtitle": "先斗町", "location": "先斗町通·锅屋町附近", "body": "照片里的道路比想象中窄。门廊、木格栅和门前的小灯让你的视线自然沿着街巷向前延伸。没有必要把每一幢建筑讲成传说，真实街景本身就有故事。", "fact": "先斗町是一条与鸭川平行、从四条附近延伸至三条附近的窄街。这张照片拍摄于2006年，反映的是当时的街巷面貌。", "stamp": "街巷", "options": [["看看另一个年份的街景", "alleyRed", "街巷"], ["先看看餐厅与门廊细节", "kaiseki", "风物"]]}, "alleyRed": {"title": "07 · 灯笼亮起来", "subtitle": "先斗町·餐厅门前", "location": "先斗町通", "body": "摄影师将红色灯笼留在前景，街巷深处有人走过。你仿佛不是站在景点观景台，而是在一条实际有人生活、消费、交谈的街上。", "fact": "照片由Sergiy Galyonkin拍摄于2022年7月。先斗町是商业和餐饮街区，而非只供观光拍照的布景。", "stamp": "灯影", "options": [["看看灯笼的图案", "lantern", "风物"], ["继续看灯光下的街巷", "streetLights", "夜色"]]}, "lantern": {"title": "08 · 一盏灯笼", "subtitle": "街巷微观", "location": "先斗町·细节", "body": "从整条街切换到一盏灯笼，你会发现城市记忆有时不来自壮观的景色，而来自能被记住的小小符号。", "fact": "这是一张2006年拍摄的先斗町灯笼特写。它不是与2022年上一张实拍同一时刻的连续画面。", "stamp": "风物", "options": [["从灯笼回到餐厅前", "kaiseki", "文化"], ["看看夜晚的先斗町", "streetLights", "夜色"]]}, "kaiseki": {"title": "09 · 餐厅前稍作停留", "subtitle": "窄巷里的选择", "location": "先斗町通", "body": "路的两边有餐厅入口和悬挂的招牌。你决定不把每一个招牌都查成“必吃攻略”，而是把一段安静的街景留在自己的旅行记录里。", "fact": "照片由James Disley拍摄于2006年11月，记录先斗町一家餐厅附近的夜间巷道。具体店铺目前是否营业未做验证。", "stamp": "在场", "options": [["看看人来人往的街巷", "streetLights", "夜色"], ["先回到河边看夜色", "riverNight", "夜色"]]}, "streetLights": {"title": "10 · 人与灯影", "subtitle": "先斗町·夜色", "location": "先斗町通", "body": "两位行人站在街巷分岔附近，灯笼把路面照出暖色。照片只是一瞬间，但它告诉你：这是一个活着的街区，而不是任何人安排好的游戏片场。", "fact": "这张2022年拍摄的实景由Sergiy Galyonkin提供。摄影画面记录了具体行人，但我们不为照片中的陌生人编造身份或故事。", "stamp": "夜色", "options": [["换一张更克制的黑白视角", "streetBw", "观察"], ["返回鸭川，给旅程收尾", "riverNight", "河流"]]}, "streetBw": {"title": "11 · 夜巷的另一种记忆", "subtitle": "黑白记录", "location": "先斗町通", "body": "去掉色彩以后，灯光、街道纵深和步行的人变得更突出。你可以在这里停留片刻，也可以带着这份印象返回桥边。", "fact": "本场景是摄影师Sergiy Galyonkin于2022年拍摄的独立黑白摄影，不是网站用滤镜改造其他图像。", "stamp": "观察", "options": [["返回鸭川的夜景", "riverNight", "河流"], ["结束这趟时光漫游", "end", "回忆"]]}, "riverNight": {"title": "12 · 城市入夜", "subtitle": "鸭川·夜景", "location": "先斗町附近的鸭川河岸", "body": "现在画面里能看到临河建筑的灯光、岸边步道和流动的水。你的旅程终于回到了鸭川，但这是2017年的真实夜景，不是此前夏日照片的同日晚间。", "fact": "2017年4月9日的摄影记录了先斗町附近的夜间鸭川。作品通过不同拍摄日期的实景切片组成体验，而非单日连续影像。", "stamp": "夜色", "options": [["收好今天的旅行记录", "end", "回忆"], ["再看看先斗町夜巷", "streetBw", "观察"]]}};
const SHORT={"station":"从这里走向鸭川，京都的慢旅行正式开始。","minamiza":"四条大桥旁的传统剧场，见证京都悠久的演艺文化。","riverSpring":"站在桥上，看鸭川与河岸步道一起伸向远处。","riverSummer":"换个季节的视角，看看夏天的鸭川河岸。","yuka":"沿河搭起的纳凉床，是京都夏日特别的风景。","oldStreet":"走进先斗町，窄巷与木格栅让脚步慢下来。","alleyRed":"灯笼亮起，街巷里透出温暖的生活气息。","lantern":"一盏纸灯笼，把先斗町的夜色留在眼前。","kaiseki":"沿着窄巷慢走，餐厅门前亮着柔和的灯。","streetLights":"灯光和人影，构成先斗町的夜晚。","streetBw":"黑白街景里，行人与街道的线条格外清晰。","riverNight":"回到鸭川，看河岸灯光融进夜色。"};
const PLACE_INFO={"station":"这里是京阪电车祇园四条站的出入口。它位于鸭川东侧，走出车站不远就能到四条大桥和南座。先看一眼站牌，再决定今天从剧场还是从河边开始。","minamiza":"南座坐落在京都四条通，靠近鸭川东岸，是与歌舞伎演出传统相关的剧场。看一看它的屋顶线条和入口装饰，能感受到京都繁忙街道里的传统气息。","riverSpring":"从四条大桥向上游望去，鸭川穿过京都市区。两岸有步行空间和临河建筑，远处的桥梁依次排开。这里值得做的事很简单：顺着河道把目光慢慢放远。","riverSummer":"这也是四条大桥附近的鸭川，但拍摄于另一年的夏季。观察河岸建筑和行走空间，与刚才的春日画面对照，能看到同一条河在不同季节的细微变化。","yuka":"鸭川西岸夏季常见的“纳凉床”，是临河餐厅设置的露天用餐平台。人们坐在河边感受夜风，也是京都颇有代表性的夏日风景。可以留意平台的支撑结构。","oldStreet":"先斗町是一条与鸭川大致平行的狭窄街巷，分布着餐饮店铺。木格栅、门廊和曲折的透视线，让这里与宽阔的城市主干道形成鲜明对比。","alleyRed":"镜头走进先斗町的餐厅街区。门前灯笼与街巷的纵深带来温暖的视觉层次；这张照片只是某一年的一个瞬间，不代表此时正在发生相同的活动。","lantern":"纸灯笼是京都传统街巷里容易注意到的细节。与整条道路相比，这张特写让你看清灯笼的材质、字样和光影。旅行记忆有时就来自这样一个小物件。","kaiseki":"先斗町的狭窄巷道两旁分布着餐饮店铺。可以观察门口的灯光、招牌与木质立面；照片记录的是过去某年的街景，不代表照片中的店铺如今仍在营业。","streetLights":"入夜后的先斗町，灯笼与街灯映亮狭窄的街道。画面中出现的行人只是实拍经过的陌生人，故事不会为他们虚构身份。静静看看夜里的街巷方向。","streetBw":"这一张独立的黑白摄影，把注意力放到街巷线条、行人轮廓和亮暗对比上。你可以不急着进入下一站，先观察照片中从近到远的空间层次。","riverNight":"夜晚的鸭川呈现出与白天不同的样子：临河建筑灯光亮起，河岸步道与水面在暗处交汇。这是另一拍摄日期的实景，适合作为本次时光漫游的结尾。"};

function imageError(){const e=$('#photobox');if(e)e.classList.add('is-error')}
function currentPlaceId(){return state.at==='welcome'?'riverSpring':state.at==='end'?'riverNight':state.at}
function zoom(){const id=currentPlaceId(),a=MEDIA[id]||MEDIA.riverSpring;const z=document.createElement('div');z.className='overlay photoViewer';z.innerHTML=`<button class="overlayClose" aria-label="关闭照片">✕ 关闭</button><img alt="${esc(a.name)}" src="${a.src}" referrerpolicy="no-referrer"><div class="viewerBottom"><p>${esc(a.name)}</p><button class="viewerInfoButton" type="button" aria-expanded="false">ⓘ 了解这里</button><div class="viewerIntro">${esc(PLACE_INFO[id]||'这里是京都实景漫游中的一站。')}</div></div>`;z.querySelector('.overlayClose').onclick=()=>z.remove();z.querySelector('.viewerInfoButton').onclick=()=>{const i=z.querySelector('.viewerIntro'),on=i.classList.toggle('show');z.querySelector('.viewerInfoButton').textContent=on?'收起介绍':'ⓘ 了解这里';z.querySelector('.viewerInfoButton').setAttribute('aria-expanded',String(on))};document.body.appendChild(z)}
function showInfo(){const id=currentPlaceId(),a=MEDIA[id]||MEDIA.riverSpring;const z=document.createElement('div');z.className='infoSheetOverlay';z.innerHTML=`<div class="infoSheet" role="dialog" aria-modal="true" aria-label="地点介绍"><div class="eyebrow">京都 · 这一站</div><h2>${esc(a.name)}</h2><p>${esc(PLACE_INFO[id]||'这里是京都实景漫游中的一站。')}</p><button class="closeInfo" type="button">继续看风景</button></div>`;z.querySelector('.closeInfo').onclick=()=>z.remove();z.onclick=e=>{if(e.target===z)z.remove()};document.body.appendChild(z)}
function topBar(inScene=false){return `<div class="topbar"><div class="brand">万象人生 · 京都</div><div class="topActions"><button class="round secondaryAction" onclick="zoom()">看全图</button><button class="round quietInfo" onclick="showInfo()">ⓘ 了解这里</button><button class="round quietToggle" onclick="toggleQuiet()">只看风景</button></div></div>`}
function toggleQuiet(){const f=document.querySelector('.immersive');if(!f)return;const q=f.classList.toggle('quiet');const btn=f.querySelector('.quietToggle');if(btn){btn.textContent=q?'显示路线':'只看风景';btn.setAttribute('aria-pressed',String(q))}}
function render(){if(state.at==='welcome'){renderWelcome();return}if(state.at==='end'){renderEnd();return}renderScene()}
function renderWelcome(){const a=MEDIA.riverSpring;app.innerHTML=`<main class="frame hero immersive">${photoBox(a)}${topBar()}<section class="content"><div class="eyebrow">京都 · 鸭川与先斗町</div><h1 class="h1 introtitle">京都的<br>一次慢旅行</h1><p class="lead">沿鸭川散步，走进先斗町。按自己的节奏看一看京都。</p><div class="muted">今天想怎样旅行？</div><div class="moodgrid">${['放空','好奇','记录'].map(x=>`<button class="mood ${state.mood===x?'active':''}" aria-pressed="${state.mood===x}" onclick="setMood('${x}')">${x}</button>`).join('')}</div><button class="btn gold" onclick="begin()">进入京都 <span class="arr">→</span></button></section></main>`}
function setMood(m){state.mood=m;save();render()}
function begin(){state.at='station';state.visited=[];state.stamps=[];state.memories=[];state.history=[];state.detail=false;save();render()}
function renderScene(){const k=state.at,s=SCENES[k],a=MEDIA[k];if(!s||!a){state.at='welcome';render();return}if(!state.visited.includes(k))state.visited.push(k);save();const old=state.visited.length;app.innerHTML=`<main class="frame immersive">${photoBox(a)}${topBar(true)}<div class="progress"><b style="width:${Math.min(100,Math.round(old/12*100))}%"></b></div><section class="content"><div class="scene-index"><div class="eyebrow">${esc(s.title.split(' · ')[0])} · 京都漫游</div><div class="muted">${old}/12 已探索</div></div><h1 class="h1">${esc(a.name)}</h1><p class="lead">${esc(SHORT[k]||s.location)}</p><div class="choices">${s.options.map((o,j)=>`<button class="btn" onclick="choose(${j})"><span>${esc(o[0])}</span><span class="arr">→</span></button>`).join('')}</div><div class="bottomnav"><button class="smallbtn" onclick="back()">← 上一站</button><button class="smallbtn" onclick="gallery()">全部影像</button></div></section></main>`}
function toggleDetail(){state.detail=!state.detail;save();render()}
function choose(n){let s=SCENES[state.at],o=s.options[n];if(!o)return;state.history.push(JSON.stringify({at:state.at,visited:[...state.visited],stamps:[...state.stamps],memories:[...state.memories],detail:state.detail}));if(state.history.length>20)state.history.shift();if(!state.stamps.includes(s.stamp))state.stamps.push(s.stamp);if(!state.stamps.includes(o[2]))state.stamps.push(o[2]);state.memories.push(`${s.subtitle}：${o[0]}`);if(state.memories.length>13)state.memories.shift();state.at=o[1];state.detail=false;save();render();window.scrollTo(0,0)}
function back(){let prev=state.history.pop();if(!prev){state.at='welcome';state.detail=false}else{let s=JSON.parse(prev);state.at=s.at;state.visited=s.visited;state.stamps=s.stamps;state.memories=s.memories;state.detail=s.detail;}save();render()}
function renderEnd(){const n=state.visited.length,st=state.stamps.length,m=state.mood,moodcopy=m==='放空'?'让城市慢一点，也让心慢一点。':m==='好奇'?'每一个转角，都有值得留意的风景。':'收藏下来的，是属于你的京都时光。';const title=REWARD_TITLES[m]||'京都云游者';const last=(state.visited.length?MEDIA[state.visited[state.visited.length-1]]:MEDIA.riverNight)?.name||'鸭川';app.innerHTML=`<main class="frame immersive">${photoBox(MEDIA.riverNight)}${topBar()}<section class="content"><div class="eyebrow">京都 · 旅程结束</div><div class="journal"><div class="rewardBadge">✦ 获得旅行称号：${esc(title)}</div><h2>把这段京都时光<br>留给自己。</h2><p class="lead">${esc(moodcopy)}</p><div class="chiprow">${state.stamps.slice(0,8).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div><div class="muted">探索 ${n} 处影像 · 收藏 ${st} 种印记 · 最后一站：${esc(last)}</div><div class="rewardFoot">专属纪念属于本次云游，不代表实际到访。</div></div><div class="choices"><button class="btn gold" onclick="openPoster()">生成我的京都旅行海报 <span class="arr">▧</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="shareLink()">分享给朋友 <span class="arr">↗</span></button><button class="btn secondary" onclick="copyLink()">复制试玩链接 <span class="arr">⧉</span></button></div><div class="sharePanel"><button class="btn secondary" onclick="review()">回看照片 <span class="arr">→</span></button><button class="btn secondary" onclick="restart()">重新出发 <span class="arr">↻</span></button></div></section></main>`}

function review(){gallery(true)}
function gallery(visitedOnly=false){const keys=visitedOnly?state.visited:Object.keys(MEDIA);const items=keys.map(k=>MEDIA[k]).filter(Boolean);app.innerHTML=`<main class="frame library"><div class="libraryhead"><div class="eyebrow">京都 · 旅行相册</div><button class="round" onclick="render()">返回旅程</button></div><h2>${visitedOnly?'走过的地方':'全部实景'}</h2><div class="librarygrid">${items.map(a=>`<div class="libraryitem"><img src="${a.src}" alt="${esc(a.name)}" loading="lazy" referrerpolicy="no-referrer"><div>${esc(a.name)}</div></div>`).join('')}</div><button class="smallbtn" onclick="help()" style="margin-top:22px">关于这趟旅行</button></main>`}
function help(){const entries=Object.values(MEDIA).map(a=>`<div>${esc(a.name)} · ${esc(a.author)} · ${esc(a.license)} · <a href="${a.page}" target="_blank" rel="noopener">来源与许可</a></div>`).join('');const z=document.createElement('div');z.className='overlay';z.innerHTML=`<button class="overlayClose">✕ 关闭</button><div class="credits"><h2 style="margin-top:0">关于这趟旅行</h2><p>这是一份京都实景互动内测作品，画面摄于不同时间，并非同一天的连续录像。</p><p>打开地点、选择方向，就能按自己的节奏浏览。</p><details><summary>照片署名与许可信息</summary>${entries}</details></div>`;z.querySelector('button').onclick=()=>z.remove();document.body.appendChild(z)}
function restart(){if(confirm('确定要重新开始吗？这会清空当前路线与收集印记。')){state={at:'welcome',mood:state.mood,visited:[],stamps:[],memories:[],history:[],detail:false};save();render()}}
function downloadCard(){openPoster()}
function travelTitle(){return REWARD_TITLES[state.mood]||'京都云游者'}
function shortPath(){let names=state.visited.map(k=>MEDIA[k]?.name).filter(Boolean);return names.length?names.slice(0,5):['祇园四条站','鸭川']}
function toast(message){document.querySelectorAll('.toast').forEach(x=>x.remove());const x=document.createElement('div');x.className='toast';x.textContent=message;document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function shareText(){return `我完成了《京都的一次慢旅行》实景云游，获得称号「${travelTitle()}」，探索了${state.visited.length}处京都影像。你也来选一条自己的路线吧。`}
async function copyLink(){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(SHARE_URL)}else{const x=document.createElement('textarea');x.value=SHARE_URL;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();if(!ok)throw Error('copy blocked')}toast('试玩网址已复制，可以发送给朋友')}catch(e){const x=document.getElementById('shareAddress');if(x){x.focus();x.select()}toast('复制受限，请长按下方网址复制')}}
async function shareLink(){if(navigator.share){try{await navigator.share({title:'京都的一次慢旅行｜万象人生',text:shareText(),url:SHARE_URL});return}catch(e){if(e?.name==='AbortError')return}}await copyLink()}
function loadCanvasPhoto(url){return new Promise(resolve=>{let done=false;const im=new Image();const finish=v=>{if(!done){done=true;resolve(v)}};im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';im.onload=()=>finish(im);im.onerror=()=>finish(null);im.src=url;setTimeout(()=>finish(null),4500)})}
function textWrap(ctx,str,x,y,width,lineH,maxLines){let line='',count=0;for(const ch of str){if(ctx.measureText(line+ch).width>width && line){ctx.fillText(line,x,y+count*lineH);count++;if(count>=maxLines)return;line=ch}else{line+=ch}}if(line && count<maxLines)ctx.fillText(line,x,y+count*lineH)}
async function makePoster(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');const bg=x.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#254446');bg.addColorStop(1,'#09191b');x.fillStyle=bg;x.fillRect(0,0,1080,1920);const photo=await loadCanvasPhoto(MEDIA.riverSpring.src);if(photo){const scale=Math.max(1080/photo.width,1120/photo.height),sw=1080/scale,sh=1120/scale,sx=(photo.width-sw)/2,sy=(photo.height-sh)/2;x.drawImage(photo,sx,sy,sw,sh,0,0,1080,1120)}else{const g=x.createLinearGradient(0,0,1080,1100);g.addColorStop(0,'#537074');g.addColorStop(1,'#112b2d');x.fillStyle=g;x.fillRect(0,0,1080,1120)}const v=x.createLinearGradient(0,320,0,1450);v.addColorStop(0,'rgba(8,21,23,0)');v.addColorStop(.65,'rgba(10,24,26,.72)');v.addColorStop(1,'#0b1d20');x.fillStyle=v;x.fillRect(0,0,1080,1500);x.fillStyle='#e5c58a';x.font='600 34px sans-serif';x.fillText('WANXIANG  /  KYOTO',80,130);x.fillStyle='#fffaf0';x.font='bold 90px serif';x.fillText('京都的一次',80,795);x.fillText('慢旅行',80,905);x.font='34px sans-serif';x.fillStyle='#dfede8';x.fillText('我在真实风景里，留了一段自己的时间。',80,995);x.strokeStyle='rgba(229,197,138,.75)';x.lineWidth=2;x.beginPath();x.moveTo(80,1070);x.lineTo(1000,1070);x.stroke();x.fillStyle='#e5c58a';x.font='bold 43px sans-serif';x.fillText('✦  '+travelTitle(),80,1160);x.fillStyle='#d6e6df';x.font='33px sans-serif';x.fillText(`我的心情：${state.mood}`,80,1235);x.fillText(`探索地点：${state.visited.length} 处   ·   收藏印记：${state.stamps.length} 种`,80,1290);x.fillStyle='#a5c6bc';x.font='30px sans-serif';x.fillText('我的云游路线',80,1395);x.fillStyle='#faf8ed';x.font='34px sans-serif';textWrap(x,shortPath().join('  ·  '),80,1460,920,58,3);x.fillStyle='#e5c58a';x.font='bold 31px sans-serif';x.fillText('旅行印记',80,1650);x.fillStyle='#d8e1de';x.font='29px sans-serif';textWrap(x,state.stamps.slice(0,9).join('   /   ')||'京都慢旅行',80,1715,680,46,2);const qr=await loadCanvasPhoto(QR_DATA);if(qr){x.fillStyle='#fff';x.fillRect(804,1575,228,228);x.drawImage(qr,815,1586,206,206)}x.strokeStyle='rgba(255,255,255,.27)';x.beginPath();x.moveTo(80,1815);x.lineTo(1000,1815);x.stroke();x.fillStyle='#a4b8b3';x.font='24px sans-serif';x.fillText('实景云游纪念 · 非实际到访凭证',80,1867);x.fillStyle='#e5c58a';x.font='22px sans-serif';x.fillText('扫码一起走京都',816,1867);return c}
let posterFile=null,posterData=null;
async function openPoster(){const z=document.createElement('div');z.className='overlay posterOverlay';z.innerHTML=`<div class="posterHead"><strong>我的京都旅行海报</strong><button class="overlayClose" type="button">✕ 关闭</button></div><p class="posterHelp" id="posterStatus">正在生成个人纪念海报…</p><div class="posterActions"><button class="btn" type="button" onclick="savePoster()">保存图片</button><button class="btn" type="button" onclick="sharePoster()">分享海报</button></div><button class="btn secondary" type="button" onclick="shareLink()" style="max-width:430px;justify-content:center">分享试玩链接</button><input class="posterLink" id="shareAddress" readonly aria-label="试玩网址" value="${SHARE_URL}">`;z.querySelector('.overlayClose').onclick=()=>z.remove();document.body.appendChild(z);posterFile=null;posterData=null;try{const c=await makePoster();if(!z.isConnected)return;posterData=c.toDataURL('image/png');const im=document.createElement('img');im.className='posterImage';im.alt='我的京都旅行纪念海报';im.src=posterData;im.title='手机可长按此图储存到照片';z.querySelector('.posterHead').after(im);z.querySelector('#posterStatus').textContent='长按海报图片可存入相册，再从微信朋友圈选择照片发布。';c.toBlob(blob=>{if(blob){posterFile=new File([blob],'京都慢旅行_我的云游纪念.png',{type:'image/png'})}},'image/png')}catch(e){z.querySelector('#posterStatus').textContent='海报暂未生成，请重新尝试';toast('海报生成失败，请重新尝试')}}
function savePoster(){if(!posterData){toast('海报还没有生成');return}const a=document.createElement('a');a.href=posterData;a.download='京都慢旅行_我的云游纪念.png';document.body.appendChild(a);a.click();a.remove();toast('如未保存，请长按海报图片，选择“储存到照片”')}
async function sharePoster(){if(posterFile&&navigator.share&&navigator.canShare?.({files:[posterFile]})){try{await navigator.share({files:[posterFile],title:'我的京都旅行纪念',text:'这是我完成的一次京都实景云游。'});return}catch(e){if(e?.name==='AbortError')return}}toast('请长按海报保存到相册，再选择微信朋友圈或发送给朋友')}

render();
</script></body></html>
