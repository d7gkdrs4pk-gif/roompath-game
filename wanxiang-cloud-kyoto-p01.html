const SCENES={"station": {"title": "01 · 旅程起点", "subtitle": "祇园四条站", "location": "四条大桥东侧附近", "body": "车站外的站名让这趟旅程有了坐标。你可以把手机暂时当作一扇窗：这里是真实存在的京都街口，并不是一张被AI编造的日系场景。", "fact": "照片拍摄于2026年6月18日。站口标识中能辨认“祇園四条駅”和“Keihan Railway”；这与车站实际名称一致。", "stamp": "抵达", "options": [["先看一座老剧场", "minamiza", "建筑"], ["直接去看河流", "riverSpring", "河流"]]}, "minamiza": {"title": "02 · 剧场的另一面", "subtitle": "南座", "location": "祇园四条站附近", "body": "你在照片里停留，仔细辨认屋檐、灯笼与门口的招牌。南座坐落在四条通的桥东一侧，属于这片街区容易识别的建筑地标。", "fact": "南座与歌舞伎演出传统有关。此图摄于2007年夜间，画面不能被当作2026年此时此刻的现场。", "stamp": "文化", "options": [["看一眼桥上的春日河景", "riverSpring", "河流"], ["切换到夏日鸭川照片", "riverSummer", "河流"]]}, "riverSpring": {"title": "03 · 站在桥上", "subtitle": "四条大桥·上游", "location": "四条大桥", "body": "河水从城市之间延展。左侧有临河建筑，右侧是树木与步道。看似只是安静的水面，视线却能顺着河道进入更远处。", "fact": "照片标注为2017年4月14日，从四条大桥向鸭川上游拍摄。不同年份的视角在本作品里作为“真实时光切片”并列展示。", "stamp": "河流", "options": [["换成夏天的河岸", "riverSummer", "河流"], ["去看看沿河的临时露台", "yuka", "文化"]]}, "riverSummer": {"title": "04 · 夏季的河岸", "subtitle": "鸭川·四条桥附近", "location": "四条大桥", "body": "这张照片里，最靠近你的不是水，而是一排沿河建筑和通向远处的步道。你可以观察木结构延伸出河岸的方式。", "fact": "照片拍摄于2025年7月17日，画面记录四条大桥附近的河岸建筑。这是另一个拍摄日，并非上一张照片的瞬间延续。", "stamp": "步行", "options": [["近看纳凉床的结构", "yuka", "文化"], ["转入先斗町的街巷", "oldStreet", "街巷"]]}, "yuka": {"title": "05 · 河边的座位", "subtitle": "纳凉床", "location": "鸭川西岸·先斗町附近", "body": "你仔细看，临河餐厅的木平台向岸外伸出，下面是支撑结构。即使隔着屏幕，也能明白为什么“靠河而坐”会成为这里夏季生活的一部分。", "fact": "京都鸭川沿岸的“纳凉床”是夏季临时设置的露天用餐平台，通常出现在5月至9月。照片为2025年6月16日实拍，位置标注在四条大桥附近。", "stamp": "风物", "options": [["走进与河岸平行的先斗町", "oldStreet", "街巷"], ["查看先斗町灯笼街景", "alleyRed", "街巷"]]}, "oldStreet": {"title": "06 · 进入窄巷", "subtitle": "先斗町", "location": "先斗町通·锅屋町附近", "body": "照片里的道路比想象中窄。门廊、木格栅和门前的小灯让你的视线自然沿着街巷向前延伸。没有必要把每一幢建筑讲成传说，真实街景本身就有故事。", "fact": "先斗町是一条与鸭川平行、从四条附近延伸至三条附近的窄街。这张照片拍摄于2006年，反映的是当时的街巷面貌。", "stamp": "街巷", "options": [["看看另一个年份的街景", "alleyRed", "街巷"], ["先看看餐厅与门廊细节", "kaiseki", "风物"]]}, "alleyRed": {"title": "07 · 灯笼亮起来", "subtitle": "先斗町·餐厅门前", "location": "先斗町通", "body": "摄影师将红色灯笼留在前景，街巷深处有人走过。你仿佛不是站在景点观景台，而是在一条实际有人生活、消费、交谈的街上。", "fact": "照片由Sergiy Galyonkin拍摄于2022年7月。先斗町是商业和餐饮街区，而非只供观光拍照的布景。", "stamp": "灯影", "options": [["看看灯笼的图案", "lantern", "风物"], ["继续看灯光下的街巷", "streetLights", "夜色"]]}, "lantern": {"title": "08 · 一盏灯笼", "subtitle": "街巷微观", "location": "先斗町·细节", "body": "从整条街切换到一盏灯笼，你会发现城市记忆有时不来自壮观的景色，而来自能被记住的小小符号。", "fact": "这是一张2006年拍摄的先斗町灯笼特写。它不是与2022年上一张实拍同一时刻的连续画面。", "stamp": "风物", "options": [["从灯笼回到餐厅前", "kaiseki", "文化"], ["看看夜晚的先斗町", "streetLights", "夜色"]]}, "kaiseki": {"title": "09 · 餐厅前稍作停留", "subtitle": "窄巷里的选择", "location": "先斗町通", "body": "路的两边有餐厅入口和悬挂的招牌。你决定不把每一个招牌都查成“必吃攻略”，而是把一段安静的街景留在自己的旅行记录里。", "fact": "照片由James Disley拍摄于2006年11月，记录先斗町一家餐厅附近的夜间巷道。具体店铺目前是否营业未做验证。", "stamp": "在场", "options": [["看看人来人往的街巷", "streetLights", "夜色"], ["先回到河边看夜色", "riverNight", "夜色"]]}, "streetLights": {"title": "10 · 人与灯影", "subtitle": "先斗町·夜色", "location": "先斗町通", "body": "两位行人站在街巷分岔附近，灯笼把路面照出暖色。照片只是一瞬间，但它告诉你：这是一个活着的街区，而不是任何人安排好的游戏片场。", "fact": "这张2022年拍摄的实景由Sergiy Galyonkin提供。摄影画面记录了具体行人，但我们不为照片中的陌生人编造身份或故事。", "stamp": "夜色", "options": [["换一张更克制的黑白视角", "streetBw", "观察"], ["返回鸭川，给旅程收尾", "riverNight", "河流"]]}, "streetBw": {"title": "11 · 夜巷的另一种记忆", "subtitle": "黑白记录", "location": "先斗町通", "body": "去掉色彩以后，灯光、街道纵深和步行的人变得更突出。你可以在这里停留片刻，也可以带着这份印象返回桥边。", "fact": "本场景是摄影师Sergiy Galyonkin于2022年拍摄的独立黑白摄影，不是网站用滤镜改造其他图像。", "stamp": "观察", "options": [["返回鸭川的夜景", "riverNight", "河流"], ["结束这趟时光漫游", "end", "回忆"]]}, "riverNight": {"title": "12 · 城市入夜", "subtitle": "鸭川·夜景", "location": "先斗町附近的鸭川河岸", "body": "现在画面里能看到临河建筑的灯光、岸边步道和流动的水。你的旅程终于回到了鸭川，但这是2017年的真实夜景，不是此前夏日照片的同日晚间。", "fact": "2017年4月9日的摄影记录了先斗町附近的夜间鸭川。作品通过不同拍摄日期的实景切片组成体验，而非单日连续影像。", "stamp": "夜色", "options": [["收好今天的旅行记录", "end", "回忆"], ["再看看先斗町夜巷", "streetBw", "观察"]]}};
